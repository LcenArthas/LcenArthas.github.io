<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="basis-title basis-desc">
            <title id="basis-title">三角形局部基与虚拟第四点</title>
            <desc id="basis-desc">三角形的两条边和指向虚拟第四点的法线共同组成三维局部基，右侧是变形后的局部基。</desc>
            <style>
              text { fill: #17212b; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 15px; }
              .mesh-line { fill: none; stroke-width: 2; }
              .axis-x { stroke: #0b5cad; }
              .axis-y { stroke: #10785c; }
              .axis-z { stroke: #a84b0d; }
            </style>
            <defs>
              <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0b5cad" /></marker>
              <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#10785c" /></marker>
              <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a84b0d" /></marker>
              <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#586675" /></marker>
            </defs>
            <text x="190" y="38" text-anchor="middle" font-weight="700">参考三角形</text>
            <polygon points="85,270 315,260 160,130" fill="#e8f2fb" stroke="#17212b" stroke-width="2"></polygon>
            <line x1="85" y1="270" x2="315" y2="260" class="mesh-line axis-x" marker-end="url(#arrow-blue)"></line>
            <line x1="85" y1="270" x2="160" y2="130" class="mesh-line axis-y" marker-end="url(#arrow-green)"></line>
            <line x1="85" y1="270" x2="205" y2="63" class="mesh-line axis-z" marker-end="url(#arrow-orange)"></line>
            <circle cx="205" cy="63" r="6" fill="#a84b0d"></circle>
            <text x="213" y="57">v4（虚拟点）</text>
            <text x="92" y="292">v1</text><text x="318" y="280">v2</text><text x="145" y="122">v3</text>
            <text x="215" y="248" fill="#0b5cad">e1</text><text x="110" y="190" fill="#10785c">e2</text><text x="127" y="142" fill="#a84b0d">n</text>
            <line x1="352" y1="176" x2="430" y2="176" stroke="#586675" stroke-width="3" marker-end="url(#arrow-gray)"></line>
            <text x="392" y="157" text-anchor="middle">局部形变 S</text>
            <text x="575" y="38" text-anchor="middle" font-weight="700">变形后三角形</text>
            <polygon points="445,275 690,230 520,110" fill="#e6f5ef" stroke="#17212b" stroke-width="2"></polygon>
            <line x1="445" y1="275" x2="690" y2="230" class="mesh-line axis-x" marker-end="url(#arrow-blue)"></line>
            <line x1="445" y1="275" x2="520" y2="110" class="mesh-line axis-y" marker-end="url(#arrow-green)"></line>
            <line x1="445" y1="275" x2="610" y2="55" class="mesh-line axis-z" marker-end="url(#arrow-orange)"></line>
            <circle cx="610" cy="55" r="6" fill="#a84b0d"></circle>
            <text x="618" y="50">ṽ4</text>
          </svg>
